name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests scripts

      - name: Ruff format check
        run: ruff format --check src tests scripts

      - name: Mypy type check
        run: mypy src/fin_kg
        continue-on-error: true

      - name: The secret scanner must pass on the repository
        run: python scripts/check_secrets.py

  test:
    name: Unit and integration tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the test suite
        run: pytest tests/unit tests/integration --cov=src/fin_kg --cov-report=xml --cov-report=term

      - name: Upload the coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  neo4j-integration:
    name: Neo4j integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/fin-kg-ci-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget -qO- http://localhost:7474/ || exit 1"
          --health-interval 15s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the Neo4j integration tests
        env:
          FIN_KG_NEO4J_URI: bolt://localhost:7687
          FIN_KG_NEO4J_USER: neo4j
          FIN_KG_NEO4J_PASSWORD: fin-kg-ci-password
        run: pytest tests/integration/test_neo4j_integration.py -v

  build:
    name: Build the container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test, security, neo4j-integration]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fin-kg-risk-engine:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — the image must contain an importable package
        # Building an image is not the same as shipping a working one: a
        # package layout that setuptools cannot discover still produces a
        # green build and a container that dies on startup. Importing the
        # entry points is the cheapest proof that the image works.
        run: |
          docker run --rm --entrypoint python fin-kg-risk-engine:${{ github.sha }} \
            -c "import fin_kg.api.app, fin_kg.worker, fin_kg.cli; print('imports ok')"

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Look for committed secrets
        run: |
          if git grep -nEI "(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{36}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)" -- . ':!.github/workflows/*'; then
            echo "::error::a potential secret was found in the repository"
            exit 1
          fi
          echo "no obvious secrets found"

      - name: Check that .env is not tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env must never be committed"
            exit 1
          fi
          echo ".env is not tracked"
