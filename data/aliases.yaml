# ---------------------------------------------------------------------------
# 实体别名表 / Entity alias table
#
# 实体对齐三级级联的**第三级**：当信用代码匹配不上、名称+地区又无法唯一命中时，
# 用这张人工维护的表把别名指向一个确定的主体。
#
# 典型场景：
#   - 简称与全称：「华信集团」→「华信控股集团有限公司」
#   - 更名：「华信置业发展有限公司」曾用名「华信房地产」
#   - 同一主体的英文名
#
# 键是别名，值是**目标主体的实体 ID**（不是名称）。实体 ID 可以在 Neo4j 浏览器里
# 查到：MATCH (c:Company) WHERE c.name CONTAINS '华信' RETURN c.id, c.name
#
# 匹配时别名会被规范化（全角转半角、去括号、剥离「有限公司」等后缀），
# 因此这里写「华信集团有限公司」和「华信集团」效果相同。
#
# 优先级：信用代码 > 名称+地区 > 本表。因此本表只在自动匹配失败时生效，
# 不会覆盖更可靠的证据。
# ---------------------------------------------------------------------------

aliases:
  # 示例（请替换为真实的主体 ID，或在导入后按实际 ID 填写）：
  # "华信集团": company-替换为实际ID
  # "华信控股": company-替换为实际ID
